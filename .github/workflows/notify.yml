name: Docs Update Notification

on:
  push:
    branches:
      - main

jobs:
  discord-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Professional Embed
        uses: sarisia/actions-status-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "success"
          color: "0xFFCC00"
          username: "GitHub | Docs"
          avatar_url: "https://em-content.zobj.net/source/microsoft-teams/337/monkey-face_1f435.png"
          title: "📖 Dokumentáció Frissítve!"
          url: "https://digifandev.github.io/Mr.Monkey-Docs/"
          description: |
            Az online tudásbázis sikeresen frissült a legújabb módosításokkal.

            **👤 Szerző:** ${{ github.actor }}
            **🌿 Ág:** `main`

            **📝 Legutóbbi módosítás:**
            ```
            ${{ github.event.head_commit.message }}
            ```

            [🔗 Kattints ide a commit megnyitásához](${{ github.event.head_commit.url }})
            
          footer: "Mr. Monkey Docs | GitHub Actions"
          timestamp: true